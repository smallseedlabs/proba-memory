# Local infrastructure and (optionally) the three services.
#   docker compose up -d postgres redis          # Postgres with pgvector on :25432, Redis on :26379
#   docker compose --profile apps up -d --build  # migrate, then memory-api, memory-ingestor, memory-jobs
# The host ports are deliberately uncommon so they do not clash with other stacks; override with
# POSTGRES_HOST_PORT / REDIS_HOST_PORT. See README.md for the local (no external provider) setup.
#
# SECURITY (checked in CI by scripts/check-compose-security.mjs):
#   * Every published port is bound to 127.0.0.1: nothing here is reachable from another machine. To expose a service, put a
#     reverse proxy with TLS in front of it; do not widen the bind.
#   * No password has a default. Each is `${NAME:?set NAME}`: compose refuses to start without it. Generate a local .env with
#     `scripts/generate-local-env.sh` (random passwords, never committed), or set them in your secret manager for a real deployment.
#     Use URL-safe passwords (hex): POSTGRES_PASSWORD and REDIS_PASSWORD are placed inside URLs.
name: proba-memory-dev

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: proba-memory-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-proba}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-proba_memory}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-25432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-proba} -d ${POSTGRES_DB:-proba_memory}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: proba-memory-redis
    environment:
      REDIS_USER: ${REDIS_USER:-proba}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    # An ACL user with a password; the `default` user (no password) is switched off. The ACL file is written at start from the
    # environment so the password never appears in the process arguments. The user may do everything except the @dangerous
    # commands (FLUSHALL, FLUSHDB, KEYS, CONFIG, DEBUG, SHUTDOWN, ...), which the memory services never need.
    # AOF persistence ON: the audit stream the ingestor reads must survive a Redis restart.
    command:
      - sh
      - -c
      - >-
        umask 077 &&
        printf 'user default off\nuser %s on >%s ~* &* +@all -@dangerous\n' "$$REDIS_USER" "$$REDIS_PASSWORD" > /tmp/users.acl &&
        exec redis-server --aclfile /tmp/users.acl --appendonly yes --appendfsync everysec
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-26379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli --user "$$REDIS_USER" ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: apply the SQL migrations (idempotent).
  migrate:
    profiles: ["apps"]
    build:
      context: .
      target: migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment: &app-env
      NODE_ENV: ${NODE_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://${POSTGRES_USER:-proba}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-proba_memory}
      # An ACL user and password, never anonymous. Use rediss:// (TLS) for a Redis outside this compose network.
      REDIS_URL: redis://${REDIS_USER:-proba}:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1024}
      EMBEDDER: ${EMBEDDER:-openai-compatible}
      EMBEDDER_BASE_URL: ${EMBEDDER_BASE_URL:-}
      EMBEDDER_MODEL: ${EMBEDDER_MODEL:-}
      EMBEDDER_VERSION: ${EMBEDDER_VERSION:-1}
      EMBEDDER_API_KEY: ${EMBEDDER_API_KEY:-}
      ALLOW_LOCAL_EMBEDDER: ${ALLOW_LOCAL_EMBEDDER:-false}
      LLM_PROVIDER: ${LLM_PROVIDER:-deepseek}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_MODEL: ${LLM_MODEL:-deepseek-flash}
      LLM_API_KEY: ${LLM_API_KEY:-}
      ALLOW_SCRIPTED_LLM: ${ALLOW_SCRIPTED_LLM:-false}
      SOURCES: ${SOURCES:-audit}
      HUB_CONTENT_SOURCE: ${HUB_CONTENT_SOURCE:-dev}
      ALLOW_DEV_CONTENT_SOURCE: ${ALLOW_DEV_CONTENT_SOURCE:-false}
      AUDIT_WORKSPACE_ID: ${AUDIT_WORKSPACE_ID:-seedbed}

  memory-api:
    profiles: ["apps"]
    build:
      context: .
      target: memory-api
    container_name: proba-memory-api
    depends_on: &app-deps
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      <<: *app-env
      PORT: 3200
      # Sign-in: Firebase ID tokens of this project, verified with Google's public keys (no secret).
      MEMORY_API_TOKEN_VERIFIER: ${MEMORY_API_TOKEN_VERIFIER:-firebase}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      # Who may use the API (verified emails). Empty lists allow nobody.
      MEMORY_API_ALLOWED_EMAILS: ${MEMORY_API_ALLOWED_EMAILS:-}
      MEMORY_API_ALLOWED_EMAIL_DOMAINS: ${MEMORY_API_ALLOWED_EMAIL_DOMAINS:-}
      MEMORY_API_ADMIN_EMAILS: ${MEMORY_API_ADMIN_EMAILS:-}
      MEMORY_API_STATIC_TOKENS: ${MEMORY_API_STATIC_TOKENS:-}
      MEMORY_API_WORKSPACE_ID: ${MEMORY_API_WORKSPACE_ID:-seedbed}
      MEMORY_API_CORS_ORIGINS: ${MEMORY_API_CORS_ORIGINS:-}
      MEMORY_API_RATE_LIMITER: ${MEMORY_API_RATE_LIMITER:-redis}
      MEMORY_API_TRUST_PROXY: ${MEMORY_API_TRUST_PROXY:-false}
    ports:
      - "127.0.0.1:${MEMORY_API_HOST_PORT:-3200}:3200"
    restart: unless-stopped

  memory-ingestor:
    profiles: ["apps"]
    build:
      context: .
      target: memory-ingestor
    container_name: proba-memory-ingestor
    depends_on: *app-deps
    environment:
      <<: *app-env
      PORT: 3201
    ports:
      - "127.0.0.1:${MEMORY_INGESTOR_HOST_PORT:-3201}:3201"
    restart: unless-stopped

  memory-jobs:
    profiles: ["apps"]
    build:
      context: .
      target: memory-jobs
    container_name: proba-memory-jobs
    depends_on: *app-deps
    environment:
      <<: *app-env
      PORT: 3202
      JOBS_ENABLED: ${JOBS_ENABLED:-decay}
    ports:
      - "127.0.0.1:${MEMORY_JOBS_HOST_PORT:-3202}:3202"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
