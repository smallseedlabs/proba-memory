name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Run ESLint
        run: npm run lint

  compose-security:
    name: Compose Security (loopback ports, no default passwords)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      # Resolves docker-compose.yml for every profile and fails if a published port is not bound to 127.0.0.1,
      # or a password has a default (only ${NAME:?...} is accepted). Starts no container.
      - name: Check docker-compose.yml
        run: node scripts/check-compose-security.mjs

  typecheck:
    name: Type Check and Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Type-check sources and tests
        run: npm run typecheck
      - name: Build all workspaces
        run: npm run build

  test:
    name: Unit Tests (in-process adapters)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Run unit tests (fails on any skipped or todo test)
        run: npm run test:ci
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: test-reports/
          if-no-files-found: ignore

  eval-gate:
    name: Retrieval Regression Gate (bundled golden set)
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      # In-process hash embedder and scripted LLM: no network, no model, deterministic. Exits non-zero when a
      # metric drops more than the tolerance below apps/memory-eval/golden/bundled.baseline.json.
      - name: Run the regression gate
        run: npm run eval:gate
      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: test-reports/eval/
          if-no-files-found: ignore

  integration-test:
    name: Integration Tests (Postgres + pgvector, Redis)
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      LOG_LEVEL: warn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      # The services come from docker-compose.yml itself: Postgres with a password and Redis with an ACL user and password,
      # both on 127.0.0.1. The passwords are random per run (nothing in the repository is a default password).
      - name: Generate a local .env (random passwords) and load it
        run: |
          scripts/generate-local-env.sh
          echo "::add-mask::$(grep '^POSTGRES_PASSWORD=' .env | cut -d= -f2)"
          echo "::add-mask::$(grep '^REDIS_PASSWORD=' .env | cut -d= -f2)"
          grep -E "^[A-Z_]+=" .env >> "$GITHUB_ENV"
      - name: Start Postgres and Redis (docker compose)
        run: docker compose up -d --wait postgres redis
      - name: Apply migrations to the service database (builds first)
        run: npm run migrate
        env:
          EMBEDDING_DIMENSION: '1024'
      # Contract suites of every Postgres and Redis adapter, migrations, the stack test (audit stream to
      # memory to retrieval), the API on Postgres and the decay job on Postgres.
      - name: Run integration tests (0 skipped)
        run: npm run test:integration:ci
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-report
          path: test-reports/
          if-no-files-found: ignore
      - name: Stop the stack
        if: always()
        run: docker compose down -v

  docker:
    name: Docker Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [migrate, memory-api, memory-ingestor, memory-jobs, memory-eval]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: ${{ matrix.target }}
          push: false
          tags: proba-memory-${{ matrix.target }}:ci
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
